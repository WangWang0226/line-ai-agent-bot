steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-central1-docker.pkg.dev/$PROJECT_ID/line-agent/line-memory-agent:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/line-agent/line-memory-agent:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - line-memory-agent
      - --image
      - us-central1-docker.pkg.dev/$PROJECT_ID/line-agent/line-memory-agent:$COMMIT_SHA
      - --region
      - us-central1
      - --platform
      - managed
      - --allow-unauthenticated
      - --labels
      - commit-sha=$COMMIT_SHA

images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/line-agent/line-memory-agent:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
